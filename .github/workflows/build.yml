name: build
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build gfortran libopenblas-dev liblapack-dev libeigen3-dev libmumps-seq-dev libmetis-dev python3-dev
      - run: cmake -S . -B build -G Ninja -DLAZYIPDCA_TESTS=ON -DLAZYIPDCA_CUTEST=OFF -DLAZYIPDCA_PYTHON=OFF
      - run: cmake --build build -j2
      - run: ./build/smoke && ./build/bp_test && ./build/best_feasible_test
      - run: python3 scripts/audit_public_repo.py
